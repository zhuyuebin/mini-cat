# Application Configuration
spring.application.name=MiniCat

# Server Configuration
server.port=8888
# 本工具无登录认证且保存数据库凭据：默认只监听本机回环地址，避免局域网/公网直接访问。
# 容器部署时由 docker-compose 通过 SERVER_ADDRESS=0.0.0.0 覆盖（对外暴露仍由 Docker 端口映射控制）。
server.address=127.0.0.1

# CSV/Excel 导入上传限制（Spring Boot 默认仅 1MB，导入稍大文件会失败）
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 连接密码加密密钥文件（首次启动自动生成；也可用 MINICAT_SECRET_KEY 环境变量覆盖）
minicat.security.key-file=./data/secret.key

# Logging Configuration
logging.level.root=INFO
logging.level.com.minicat=DEBUG

# DevTools Configuration
spring.devtools.restart.enabled=true

# HikariCP Connection Pool Configuration
# 每个「连接配置 + 目标数据库」一个池：单池上限 5，最小空闲 1，避免多库时连接数爆炸
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=MiniCatHikariPool
spring.datasource.hikari.leak-detection-threshold=60000
