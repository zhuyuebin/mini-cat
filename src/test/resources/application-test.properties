# 测试专用配置：元数据库完全使用 H2 内存库，避免污染项目目录下的 ./data
spring.datasource.url=jdbc:h2:mem:minicat_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
minicat.datasource.ddl-auto=create-drop

# 测试用加密密钥文件（生成在 target/ 下，随构建清理）
minicat.security.key-file=target/test-data/secret.key

# 测试环境不需要 devtools / 详细日志
spring.devtools.restart.enabled=false
logging.level.com.minicat=WARN
logging.level.root=WARN
