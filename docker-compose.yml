version: '3.8'

services:
  minicat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minicat
    ports:
      - "8080:8080"
    volumes:
      # 持久化H2数据库文件
      - ./data:/app/data
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms512m -Xmx1024m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - minicat-network

networks:
  minicat-network:
    driver: bridge
