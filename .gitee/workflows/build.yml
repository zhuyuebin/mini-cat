# Gitee Go 流水线配置
# 用于自动构建和测试

version: '1.0'
name: MiniCat Build Pipeline
displayName: MiniCat 构建流水线

stages:
  - name: build
    displayName: 构建阶段
    steps:
      - step: build@maven
        name: maven_build
        displayName: Maven 构建
        jdkVersion: '17'
        mavenVersion: '3.8.6'
        commands:
          - mvn clean package -DskipTests
        artifacts:
          - target/*.jar

  - name: test
    displayName: 测试阶段
    steps:
      - step: test@maven
        name: maven_test
        displayName: Maven 测试
        jdkVersion: '17'
        commands:
          - mvn test

triggers:
  push:
    branches:
      include:
        - main
        - master
  pull_request:
    branches:
      include:
        - main
        - master
