services:
  minicat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minicat
    ports:
      - "8888:8888"
    volumes:
      # 持久化 H2 元数据与连接密码加密密钥（data/secret.key）
      - ./data:/app/data
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # 容器内必须监听 0.0.0.0 才能被端口映射访问；对外暴露范围由上面的 ports 决定
      - SERVER_ADDRESS=0.0.0.0
      # JVM 会自动读取 JAVA_TOOL_OPTIONS；原来的 JAVA_OPTS 没有任何组件消费
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx1024m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - minicat-network

networks:
  minicat-network:
    driver: bridge
